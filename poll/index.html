<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What do you want to learn about agents?</title>
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
:root {
  --svart: #000; --vit: #fff; --gra: #f5f5f5; --gra-3: #666;
  --lila: #7300f0; --lila-2: #8d33ff; --gul: #ffd400;
  --f-display: "Berghs Serif", Newsreader, "Times New Roman", serif;
  --f-body: Aeonik, Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--gra); color: var(--svart); font: 400 17px/1.45 var(--f-body); -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; min-height: 100dvh; }
.topp { background: var(--svart); color: var(--vit); padding: 14px 20px; font: 700 13px/1 var(--f-body); letter-spacing: .04em; text-transform: uppercase;
  display: flex; justify-content: space-between; align-items: center; }
.topp .ord { font-family: var(--f-display); font-weight: 500; font-size: 17px; letter-spacing: .02em; }
.rander { height: 14px; background: repeating-linear-gradient(135deg, var(--lila) 0 14px, var(--lila-2) 14px 28px); }
main { flex: 1; padding: 28px 20px 32px; max-width: 560px; width: 100%; margin: 0 auto; }
h1 { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; font-size: clamp(34px, 10vw, 46px); line-height: .98; margin: 0 0 14px; letter-spacing: -.005em; }
.under { margin: 0 0 22px; color: #4a4a4a; font-size: 17px; }
label { display: block; font: 700 13px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 8px; }
textarea { width: 100%; min-height: 132px; resize: vertical; border: 2px solid var(--svart); border-radius: 0; background: var(--vit);
  padding: 14px; font: 400 18px/1.4 var(--f-body); color: var(--svart); -webkit-appearance: none; }
textarea:focus { outline: 3px solid var(--lila); outline-offset: 2px; }
.rad { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; color: var(--gra-3); }
button { margin-top: 18px; width: 100%; border: 0; border-radius: 0; background: var(--svart); color: var(--vit); padding: 18px 20px;
  font: 700 16px/1 var(--f-body); text-transform: uppercase; letter-spacing: .04em; cursor: pointer; -webkit-appearance: none; }
button:active { transform: translateY(1px); }
button[disabled] { opacity: .45; }
.fel { margin-top: 14px; background: #ffe1e1; padding: 12px 14px; font-size: 15px; display: none; }
.tack { display: none; }
.tack .bock { display: inline-block; background: var(--gul); padding: 10px 14px; font: 700 14px/1 var(--f-body); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 18px; }
.tack p.ditt { background: var(--vit); padding: 16px; font: 700 18px/1.3 var(--f-body); margin: 0 0 22px; transform: rotate(-1.2deg); box-shadow: 0 4px 14px rgba(0,0,0,.06); }
.tack button { background: var(--vit); color: var(--svart); border: 2px solid var(--svart); }
.visa-tack form { display: none; } .visa-tack .tack { display: block; }
footer { padding: 18px 20px 26px; font-size: 13px; color: var(--gra-3); text-align: center; }
</style>
</head>
<body>
<div class="topp"><span class="ord">BERGHS</span><span>Always-on agents</span></div>
<div class="rander" aria-hidden="true"></div>
<main id="main">
  <h1>What do you want to learn about agents?</h1>
  <form id="form" novalidate>
    <p class="under">Write a question or a topic. It shows up on the big screen, anonymously.</p>
    <label for="svar">Your answer</label>
    <textarea id="svar" maxlength="200" placeholder="E.g. how do I get an agent to write my weekly report?" required></textarea>
    <div class="rad"><span>No name needed</span><span id="kvar">200</span></div>
    <button id="skicka" type="submit">Send</button>
    <div class="fel" id="fel" role="alert"></div>
  </form>
  <div class="tack" aria-live="polite">
    <span class="bock">Thanks! Look at the screen</span>
    <p class="ditt" id="ditt"></p>
    <button id="igen" type="button">Send another one</button>
  </div>
</main>
<footer>Martin Schrammel · Berghs</footer>
<script>
const POLL = new URLSearchParams(location.search).get('p') || 'berghs-agents';
const URL_ = 'https://pakkfzpfwemldbzkigmr.supabase.co/rest/v1/poll_answers';
const KEY = 'sb_publishable_NYZd7cIgVTLBxfzNZ_6yKQ_32tCDxpO';
const form = document.getElementById('form'), ta = document.getElementById('svar'), btn = document.getElementById('skicka');
const fel = document.getElementById('fel'), kvar = document.getElementById('kvar');
ta.addEventListener('input', () => { kvar.textContent = 200 - ta.value.length; });
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const answer = ta.value.trim();
  fel.style.display = 'none';
  if (!answer) { ta.focus(); return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const r = await fetch(URL_, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ poll: POLL, answer }) });
    if (!r.ok) throw new Error((await r.text()).includes('Too many') ? 'Lots of answers right now. Try again in a minute.' : 'Could not send. Try again.');
    document.getElementById('ditt').textContent = answer;
    document.body.classList.add('visa-tack');
    ta.value = ''; kvar.textContent = 200;
  } catch (err) {
    fel.textContent = err.message && err.message.length < 80 ? err.message : 'Could not send. Check your connection and try again.';
    fel.style.display = 'block';
  } finally { btn.disabled = false; btn.textContent = 'Send'; }
});
document.getElementById('igen').addEventListener('click', () => { document.body.classList.remove('visa-tack'); ta.focus(); });
</script>
</body>
</html>
